included:
  - TwoWatch
  # L'estensione widget e' codice nuovo: nasce dentro il gate, non fuori.
  - SomtoWidgets

excluded:
  - build
  - TwoWatch/Resources
  - SomtoWidgets/Resources

# Filosofia di questo file: RATCHET, non pulizia.
#
# L'app e' live e ha 73k righe scritte senza linter. Attivare le regole di
# default significherebbe migliaia di violazioni il primo giorno, che e' lo
# stesso che non avere un linter (si impara a ignorarlo).
#
# Quindi: soglie tarate SOPRA lo stato attuale, in modo che oggi non blocchino
# nulla, ma che il prossimo file da 10.000 righe non possa nascere in silenzio.
# Ogni fase del refactoring (docs/IOS_REFACTOR_PLAN.md) STRINGE queste soglie:
# il numero scende, non sale mai. Se un limite va alzato, e' un bug del piano,
# non del limite.
#
# `error` sta solo dove la violazione e' un difetto vero e non un fatto storico.

disabled_rules:
  # Rumore puro su una codebase SwiftUI matura: si riattivano, se mai, dopo
  # che i monoliti sono spezzati.
  - trailing_whitespace
  - todo
  - line_length
  - nesting
  - identifier_name
  - type_name
  - large_tuple
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - opening_brace
  - closure_parameter_position

  # Formattazione pura. Attivandole il baseline passava da 18 a 91 warning, di
  # cui 73 su spazi, virgole e a-capo: un linter che urla per il vuoto viene
  # ignorato anche quando ha ragione, e allora tanto vale non averlo. Questo e'
  # lavoro da SwiftFormat (deterministico, auto-fix), non da gate di qualita'.
  # `implicit_optional_initialization` da sola faceva 42/91: su `@State private
  # var x: Foo? = nil` il `= nil` esplicito e' anche piu' leggibile.
  - implicit_optional_initialization
  - trailing_newline
  - vertical_whitespace
  - trailing_comma
  - private_over_fileprivate
  - control_statement
  - unused_closure_parameter
  - for_where

opt_in_rules:
  - empty_count
  - force_unwrapping
  - redundant_nil_coalescing

# `empty_count` e' opt-in e ha 3 violazioni: sono correzioni banali e a
# comportamento identico, ma vanno in un commit loro, non in quello che
# introduce il linter (un commit che aggiunge tooling non modifica codice).
empty_count:
  severity: warning

# ---------------------------------------------------------------------------
# Le soglie del ratchet. Valori attuali misurati su 7bb33c0.
# Peggiore attuale in commento: e' il numero da far scendere.
# ---------------------------------------------------------------------------

file_length:
  warning: 11000   # peggiore: TitleDetailView.swift 10.437 -> obiettivo Fase 3: 800
  error: 12000
  ignore_comment_only_lines: true

type_body_length:
  warning: 1100    # peggiore fra le View: TitleDetailViewModel ~1.020 -> obiettivo: 400
  error: 3000      # peggiore assoluto: TitleRepository 2.790 -> obiettivo Fase 3: split per dominio

function_body_length:
  warning: 350
  error: 500

cyclomatic_complexity:
  warning: 30
  error: 45

# `force_cast` non ha violazioni oggi: parte a error, cosi' resta a zero.
force_cast:
  severity: error

# `force_try` invece ne ha 4, tutte `try! NSRegularExpression(pattern:)` su
# pattern letterali (PostModels, RatingDisplayFormat). E' l'idioma comune e non
# e' mai fallito, ma un pattern scritto male crasha al primo render invece che
# in compilazione. Warning, non error: la sostituzione va in Fase 5.
force_try:
  severity: warning

force_unwrapping:
  severity: warning

# NB: il footgun `Dictionary(uniqueKeysWithValues:)` NON e' una custom_rule qui.
# Una regex non sa distinguere una chiave doc-id (legittima) da una chiave
# derivata (crash): provandoci usciva rumore su 23 punti quasi tutti corretti.
# La logica con allowlist vive in scripts/check-swift-footguns.mjs, condivisa da
# hook pre-commit e CI — stesso schema di scripts/check-i18n-regressions.mjs.
