name: Bug report
description: Segnala un comportamento riproducibile di Somto
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Non inserire segreti o dati personali. Per vulnerabilità usa SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Cosa è successo e cosa ti aspettavi?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Come riprodurre
      description: Indica passaggi minimi, ambiente e frequenza.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Superficie
      options:
        - PWA
        - iOS
        - Backend o Firebase
        - Blog o SEO
        - Sviluppo locale
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versione
      placeholder: Versione app, commit o URL
  - type: textarea
    id: context
    attributes:
      label: Contesto aggiuntivo
      description: Log sanitizzati o screenshot senza dati personali.
