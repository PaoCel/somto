name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Test unitari puri (node:test, nessun emulatore): gate veloce.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Unit tests
        working-directory: functions
        run: npm run test:unit

      - name: Install web test deps
        run: npm ci

      - name: Web unit tests
        run: npm test

      - name: Syntax check functions-public-profile
        run: node --check functions-public-profile/index.js

      - name: Syntax check deploy guard scripts
        run: |
          node --check scripts/check-deploy-safety.mjs
          node --check scripts/print-deploy-project.mjs

      - name: Public repository hygiene
        run: npm run check:public

      # Il repo rilascia piu' volte a settimana: senza questo, mentre si traduce
      # da una parte si ri-italianizza dall'altra e dopo qualche mese si rifa'
      # lo stesso audit da capo. L'hook pre-commit fa lo stesso controllo ma e'
      # locale (va installato a mano, si aggira con --no-verify): questo no.
      - name: i18n — nessuna regressione nei file migrati
        run: node scripts/check-i18n-regressions.mjs

  # Guardie Swift che girano SENZA toolchain Xcode, quindi su ubuntu (gratis).
  #
  # Il gate iOS completo (SwiftLint, build Debug/Release, test) vive sul Mac:
  # scripts/ios-ci.sh, invocato dall'hook pre-push e da scripts/ios-release.sh.
  # Un runner macOS qui costerebbe 10x i minuti e il monte gratuito del piano
  # Free basta a ~1-2 build/mese contro le ~4,6 modifiche iOS al giorno di
  # questo repo — vedi docs/IOS_REFACTOR_PLAN.md §Fase 0.
  #
  # Quello che resta qui e' il controllo che NON deve essere aggirabile: l'hook
  # si salta con --no-verify, questo no.
  swift-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      # Crash v0.3.22: Dictionary(uniqueKeysWithValues:) su chiave derivata.
      - name: Footgun Swift
        run: node scripts/check-swift-footguns.mjs

  # Firestore + Storage rules nell'emulatore (richiede JDK).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Set up JDK 21
        id: java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install firebase-tools
        run: |
          echo "JAVA_HOME=${{ steps.java.outputs.path }}" >> "$GITHUB_ENV"
          echo "PATH=${{ steps.java.outputs.path }}/bin:${PATH}" >> "$GITHUB_ENV"
          npm install -g firebase-tools
        shell: bash

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Rules tests via emulators
        working-directory: functions
        env:
          JAVA_HOME: ${{ steps.java.outputs.path }}
          FIREBASE_EMULATOR_JAVA_BIN: ${{ steps.java.outputs.path }}/bin/java
        run: npm run test:rules

  # Il blog Eleventy deve buildare: protegge il deploy hosting.
  blog-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Build blog
        working-directory: blog
        run: |
          npm ci
          npm run build
