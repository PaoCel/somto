<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notifiche — Somto</title>
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Tutte le notifiche del tuo account">
  <link rel="stylesheet" href="/css/main.css">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Somto">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0A0A0A">
</head>
<body class="notifications-page">
  <div id="appSplash" class="app-splash"><img class="splash-logo splash-wordmark" src="/icons/somto-wordmark.png" alt="Somto" data-i18n-attr="alt"><div class="splash-spinner"></div></div>

  <main class="container page">
    <h1 class="notif-title" data-i18n>Notifiche</h1>

    <!-- Summary capsule: totali · non lette -->
    <div class="notif-summary" aria-live="polite">
      <span class="notif-summary-group">
        <svg class="notif-summary-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.4a3 3 0 0 0-3 3v.4C6.5 6.7 5 9.1 5 12v3.3l-1.5 2.1c-.4.6 0 1.4.8 1.4h15.4c.8 0 1.2-.8.8-1.4L19 15.3V12c0-2.9-1.5-5.3-4-6.2v-.4a3 3 0 0 0-3-3Z"/><path d="M9.5 20a2.6 2.6 0 0 0 5 0Z"/></svg>
        <strong id="notifTotalCount">0</strong>
        <span class="notif-summary-label" data-i18n>notifiche totali</span>
      </span>
      <span class="notif-summary-divider" aria-hidden="true"></span>
      <span class="notif-summary-group">
        <strong id="notifUnreadCount" class="accent">0</strong>
        <span class="notif-summary-label" data-i18n>non lette</span>
        <span id="notifUnreadDot" class="notif-summary-dot" aria-hidden="true" hidden></span>
      </span>
    </div>

    <!-- Filter chips: Tutte / Non lette / Commenti  + Segna tutte lette -->
    <div class="notif-filters" role="tablist" aria-label="Filtro notifiche">
      <button class="notif-chip active" type="button" data-view="all" role="tab" aria-selected="true">
        <svg class="notif-chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <span data-i18n>Tutte</span>
      </button>
      <button class="notif-chip" type="button" data-view="unread" role="tab" aria-selected="false">
        <span class="notif-chip-dot" aria-hidden="true"></span>
        <span data-i18n>Non lette</span>
      </button>
      <button class="notif-chip" type="button" data-view="comments" role="tab" aria-selected="false">
        <svg class="notif-chip-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2c-5.2 0-9.4 3.5-9.4 7.9 0 2.4 1.3 4.6 3.3 6-.2 1.1-.8 2.4-1.8 3.3-.3.3-.1.8.3.8 2 0 3.8-.7 5.1-1.6 1 .2 2 .4 3.2.4 5.2 0 9.4-3.6 9.4-7.9S17.2 3.2 12 3.2Z"/></svg>
        <span data-i18n>Commenti</span>
      </button>
      <button id="btnMarkAllRead" class="notif-mark-all" type="button" hidden>
        <svg class="notif-chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="8.5 12 11 14.5 15.5 9.5"/></svg>
        <span data-i18n>Segna tutte come lette</span>
      </button>
    </div>

    <section id="notificationsList" class="notif-list" aria-live="polite"></section>
  </main>

  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

  <script src="/firebaseConfig.js"></script>
  <script type="module" src="/js/pages/notifications.page.js?v=138-2026-07-27-import-notifications"></script>
  <script type="module" src="/js/utils/tabbar.bootstrap.js"></script>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
