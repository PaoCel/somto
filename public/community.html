<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Community — Somto</title>
  <meta name="description" content="Feed dei titoli visti e votati da amici e persone che segui, e discussioni attive.">
  <link rel="canonical" href="https://somto.it/community.html">
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="/css/home.bundle.css">
  <link rel="stylesheet" href="/css/components/app-shell.css">
  <link rel="stylesheet" href="/css/main.css">
  <!-- App / Favicon -->
<!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Somto">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0A0A0A">
</head>
<body>
  <div id="appSplash" class="app-splash"><img class="splash-logo splash-wordmark" src="/icons/somto-wordmark.png" alt="Somto" data-i18n-attr="alt"><div class="splash-spinner"></div></div>
  <main class="container page home-page">

    <button id="btnReload" class="home-reload-fab" type="button" aria-label="Aggiorna feed" title="Aggiorna">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7"></path>
        <path d="M21 3v7h-7"></path>
      </svg>
    </button>

    <!-- "Di cosa parliamo?": starter discussione su un titolo + prompt per il composer. -->
    <div id="discussionStarter" class="glass-card discussion-starter-card" style="display:none;">
      <div class="title-section-head">
        <h3 class="title-section-title" data-i18n>Apri una discussione</h3>
        <p class="title-section-sub" data-i18n>Scegli un titolo oppure parti da uno spunto per iniziare il thread.</p>
      </div>

      <button id="btnStartTitleDiscussion" class="discussion-cta-btn" type="button">
        <span class="discussion-cta-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <span class="discussion-cta-text">
          <span class="discussion-cta-title" data-i18n>Scegli un titolo</span>
          <span class="discussion-cta-sub" data-i18n>Cerca un film o una serie e apri il thread</span>
        </span>
        <svg class="discussion-cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <div id="discussionTitleSearch" class="discussion-title-search" style="display:none;">
        <input type="search" inputmode="search" autocomplete="off" id="discussionTitleSearchInput"
          placeholder="Cerca un film o una serie…" aria-label="Cerca un titolo su cui aprire la discussione" data-i18n-attr="placeholder,aria-label">
        <div id="discussionTitleSearchResults" class="discussion-title-search-results"></div>
      </div>

      <div class="discussion-prompts-divider" aria-hidden="true">
        <span class="divider-label">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 7.1L21 11l-7.1 1.9L12 20l-1.9-7.1L3 11l7.1-1.9L12 2z"/></svg>
          <span data-i18n>Oppure prova uno spunto</span>
        </span>
      </div>
      <div class="discussion-prompts">
        <button type="button" class="discussion-prompt-row discussion-prompt-chip" data-tone="violet" data-prompt="Cosa hai visto stasera?">
          <span class="discussion-prompt-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
          </span>
          <span class="discussion-prompt-text" data-i18n>Cosa hai visto stasera?</span>
          <svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button type="button" class="discussion-prompt-row discussion-prompt-chip" data-tone="amber" data-prompt="Consiglia una serie sottovalutata">
          <span class="discussion-prompt-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </span>
          <span class="discussion-prompt-text" data-i18n>Consiglia una serie sottovalutata</span>
          <svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button type="button" class="discussion-prompt-row discussion-prompt-chip" data-tone="rose" data-prompt="Un film che ti ha deluso di recente?">
          <span class="discussion-prompt-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </span>
          <span class="discussion-prompt-text" data-i18n>Un film che ti ha deluso di recente?</span>
          <svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- Discussioni per te: thread pubblici ranked per rilevanza genere
         (fallback ai più recenti se nessun match). Vedi buildRelevantDiscussions
         in community.page.js. Titolo dinamico via #communityThreadsHead h3. -->
    <section id="communityThreads" class="home-disc-section">
      <header id="communityThreadsHead" class="home-disc-head">
        <div class="home-disc-head-copy">
          <h3 data-i18n>Discussioni per te</h3>
          <p class="home-disc-sub" data-role="disc-sub" data-i18n>In base ai generi che guardi</p>
        </div>
        <a class="home-disc-more" href="/threads.html" data-i18n>Vedi tutte</a>
      </header>
      <div id="communityThreadsList" class="threads-list"></div>
    </section>

    <!-- Composer (mirror iOS HomeComposerCard) -->
    <div id="composer" class="home-composer glass-card" style="display:none;">
      <div class="home-composer-row">
        <div id="composerAvatar" class="avatar avatar-md" aria-hidden="true"></div>
        <div class="home-composer-identity">
          <span id="composerName" class="home-composer-name">Tu</span>
        </div>
        <div class="home-composer-visibility-wrap" id="composerVisibility" data-value="public">
          <button type="button" class="home-composer-visibility" id="composerVisibilityBtn" aria-label="Visibilità del post" aria-haspopup="true" aria-expanded="false" data-i18n-attr="aria-label">
            <svg class="visibility-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <span data-visibility-label data-i18n>Pubblico</span>
            <svg class="visibility-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="home-composer-visibility-menu" id="composerVisibilityMenu" role="menu" hidden>
            <button type="button" class="home-composer-visibility-opt is-selected" data-value="public" role="menuitemradio" aria-checked="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <span class="opt-copy"><span class="opt-title" data-i18n>Pubblico</span><span class="opt-help" data-i18n>Visibile a tutti</span></span>
            </button>
            <!-- "Amici" rimosso: con il grafo amicizie in dismissione la rule
                 isFriendWith è falsa per tutti, quindi un post friends-only non
                 lo leggerebbe nessuno. I post storici restano leggibili. -->
            <button type="button" class="home-composer-visibility-opt" data-value="private" role="menuitemradio" aria-checked="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <span class="opt-copy"><span class="opt-title" data-i18n>Privato</span><span class="opt-help" data-i18n>Solo tu</span></span>
            </button>
          </div>
        </div>
      </div>
      <div class="home-composer-textarea-wrap">
        <div id="composerMentionDropdown" class="mention-dropdown" style="display:none;"></div>
        <textarea id="composerText" class="home-composer-input" rows="2" placeholder="A cosa stai pensando?" data-i18n-attr="placeholder"></textarea>
      </div>
      <div class="home-composer-actions">
        <div class="home-composer-hint" data-i18n>@ amici · # titoli e persone</div>
        <button id="composerSubmit" class="btn small primary home-composer-submit" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <span data-i18n>Pubblica</span>
        </button>
      </div>
    </div>

    <div id="currentEvent" style="display:none;"></div>

    <div id="quickAction" class="quick-action" style="display:none;"></div>

    <div id="socialInsight" style="display:none;"></div>

    <div id="feed" class="feed-list" role="region" aria-live="polite" aria-label="Feed"></div>
    <div id="feedLoadMore" class="feed-loadmore"></div>

    <script>
      // Custom dropdown per la visibilità del post: replica `<select>` ma resta dentro la card.
      (function bootstrapComposerVisibility() {
        const wrap = document.getElementById("composerVisibility");
        const btn = document.getElementById("composerVisibilityBtn");
        const menu = document.getElementById("composerVisibilityMenu");
        if (!wrap || !btn || !menu) return;

        const label = btn.querySelector("[data-visibility-label]");
        const opts = Array.from(menu.querySelectorAll(".home-composer-visibility-opt"));

        const close = () => {
          menu.hidden = true;
          btn.setAttribute("aria-expanded", "false");
        };
        const open = () => {
          menu.hidden = false;
          btn.setAttribute("aria-expanded", "true");
        };

        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          menu.hidden ? open() : close();
        });

        opts.forEach((opt) => {
          opt.addEventListener("click", (e) => {
            e.stopPropagation();
            const value = opt.dataset.value || "public";
            wrap.dataset.value = value;
            if (label) label.textContent = opt.querySelector(".opt-title")?.textContent || "Pubblico";
            opts.forEach((o) => {
              const sel = o === opt;
              o.classList.toggle("is-selected", sel);
              o.setAttribute("aria-checked", sel ? "true" : "false");
            });
            close();
          });
        });

        document.addEventListener("click", (e) => {
          if (!menu.hidden && !wrap.contains(e.target)) close();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !menu.hidden) close();
        });
      })();
    </script>
  </main>

  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

  <script src="/firebaseConfig.js"></script>
  <script type="module" src="/js/pages/community.page.js"></script>
  <script type="module" src="/js/utils/tabbar.bootstrap.js"></script>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
