<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thread — Somto</title>
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Thread privati, di gruppo e pubblici">
  <link rel="stylesheet" href="/css/main.css">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Somto">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0A0A0A">
</head>
<body>
  <div id="appSplash" class="app-splash"><img class="splash-logo splash-wordmark" src="/icons/somto-wordmark.png" alt="Somto" data-i18n-attr="alt"><div class="splash-spinner"></div></div>

  <main class="container page">
    <h1 class="threads-page-title" data-i18n>Threads</h1>

    <div class="threads-segmented" role="tablist" aria-label="Sezioni thread">
      <button class="threads-seg-btn active" data-filter="discussions" type="button" role="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <span data-i18n>Discussioni</span>
      </button>
      <button class="threads-seg-btn" data-filter="messages" type="button" role="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
        </svg>
        <span data-i18n>Messaggi</span>
      </button>
      <button class="threads-seg-btn" data-filter="groups" type="button" role="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span data-i18n>Gruppi</span>
      </button>
      <button class="threads-seg-btn" id="supportThreadsTab" data-filter="support" type="button" role="tab" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <path d="M8 8h8M8 12h5"/>
        </svg>
        <span data-i18n>Assistenza</span>
      </button>
    </div>

    <div class="threads-section-label" id="threadsSectionLabel" data-i18n>DISCUSSIONI PUBBLICHE</div>
    <section id="threadList" class="threads-list"></section>
  </main>

  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/js/utils/tabbar.bootstrap.js"></script>

  <!-- Firebase config MUST be loaded before any module that imports /js/firebase.js -->
  <script src="/firebaseConfig.js"></script>
  <script type="module" src="/js/pages/threads.page.js"></script>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
