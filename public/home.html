<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home — Somto</title>
  <meta name="description" content="Il tuo punto di partenza su Somto: un suggerimento su misura e cosa scoprire oggi.">
  <link rel="canonical" href="https://somto.it/">
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="/css/home.bundle.css">
  <link rel="stylesheet" href="/css/components/app-shell.css">
  <!-- App / Favicon -->
<!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Somto">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0A0A0A">
</head>
<body>
  <div id="appSplash" class="app-splash"><img class="splash-logo splash-wordmark" src="/icons/somto-wordmark.png" alt="Somto" data-i18n-attr="alt"><div class="splash-spinner"></div></div>
  <main class="container page home-page">

    <button id="btnReload" class="home-reload-fab" type="button" aria-label="Aggiorna feed" title="Aggiorna">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7"></path>
        <path d="M21 3v7h-7"></path>
      </svg>
    </button>

    <section id="onboardingNudge" class="onboarding-nudge-slot" style="display:none;"></section>

    <section class="home-official-import" aria-label="Novità Somto" data-i18n-attr="aria-label">
      <div class="home-official-import-body">
        <h2 data-i18n>Importa i tuoi dati</h2>
        <p data-i18n>TV Time chiude il 15/07: importa ora. Funziona anche con Netflix.</p>
      </div>
      <a class="home-official-import-action" href="/import.html">
        <span data-i18n>Apri</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
      </a>
    </section>

    <div id="homeHero"></div>

    <section class="home-disc-section" id="homeContinueSection" style="display:none;">
      <header class="home-disc-head"><h3 data-i18n>Continua a guardare</h3></header>
      <div class="home-disc-scroll" id="homeContinueScroll"></div>
    </section>

    <section class="home-disc-section" id="homeUpcomingSection" style="display:none;">
      <header class="home-disc-head">
        <div class="home-disc-head-copy">
          <h3 data-i18n>In uscita</h3>
          <p class="home-disc-sub" data-i18n>I film e le serie in arrivo, con la data.</p>
        </div>
      </header>
      <div class="home-disc-scroll home-upcoming-scroll" id="homeUpcomingScroll"></div>
    </section>

    <section class="home-disc-section" id="homeNewContentSection" style="display:none;">
      <header class="home-disc-head"><h3 data-i18n>Novità per te</h3></header>
      <div class="home-disc-scroll" id="homeNewContentScroll"></div>
    </section>

    <section class="home-disc-section" id="homeProviderSection" style="display:none;">
      <header class="home-disc-head">
        <div class="home-disc-head-copy">
          <h3 id="homeProviderTitle"></h3>
          <p class="home-disc-sub" data-i18n>In base ai titoli che guardi, non a un abbonamento dichiarato</p>
        </div>
      </header>
      <div class="home-disc-scroll" id="homeProviderScroll"></div>
    </section>

    <section class="home-disc-section" id="discBlogSection">
      <header class="home-disc-head"><h3 data-i18n>Dal blog</h3><a class="home-disc-more" href="/blog/" data-i18n>Vedi tutti</a></header>
      <div class="home-disc-scroll home-blog-scroll" id="discBlogScroll"></div>
    </section>

    <section class="home-disc-section" id="discTrendingSection">
      <header class="home-disc-head"><h3>Tendenze</h3></header>
      <div class="home-disc-scroll" id="discTrendingScroll"></div>
    </section>

    <section class="home-disc-section" id="discFreshSection">
      <header class="home-disc-head"><h3 data-i18n>Novità</h3></header>
      <div class="home-disc-scroll" id="discFreshScroll"></div>
    </section>
  </main>

  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

  <script src="/firebaseConfig.js"></script>
  <script type="module" src="/js/pages/home.page.js"></script>
  <script type="module" src="/js/utils/tabbar.bootstrap.js"></script>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
