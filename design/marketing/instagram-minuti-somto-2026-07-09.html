<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Somto - minuti caricati oggi</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fbff;
      --muted: rgba(248, 251, 255, 0.72);
      --soft: rgba(248, 251, 255, 0.11);
      --cyan: #00d9ff;
      --pink: #ff1f8f;
      --orange: #ff8a00;
      --night: #070b13;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .post {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(0, 217, 255, 0.18), transparent 32%),
        linear-gradient(315deg, rgba(255, 31, 143, 0.24), transparent 34%),
        radial-gradient(circle at 50% 118%, rgba(255, 138, 0, 0.20), transparent 34%),
        var(--night);
    }

    .post::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 82%);
      opacity: 0.5;
    }

    .post::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 16px;
      background: linear-gradient(90deg, var(--cyan), var(--pink), var(--orange));
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 72px 84px 78px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .logo {
      width: 300px;
      height: auto;
      display: block;
      filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.42));
    }

    .date {
      padding: 13px 18px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      color: var(--muted);
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .eyebrow {
      margin-top: 86px;
      color: var(--cyan);
      font-size: 34px;
      font-weight: 850;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 28px 0 0;
      max-width: 900px;
      font-size: 124px;
      line-height: 0.92;
      letter-spacing: 0;
      font-weight: 920;
    }

    .number {
      display: block;
      font-size: 176px;
      line-height: 0.84;
      color: var(--ink);
      text-shadow: 0 18px 52px rgba(0,0,0,0.54);
    }

    .label {
      display: block;
      margin-top: 22px;
    }

    .lead {
      margin: 34px 0 0;
      max-width: 810px;
      color: rgba(248,251,255,0.82);
      font-size: 38px;
      line-height: 1.18;
      font-weight: 650;
    }

    .stats {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .stat {
      min-height: 146px;
      padding: 24px 28px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 24px 70px rgba(0,0,0,0.18);
    }

    .stat strong {
      display: block;
      font-size: 54px;
      line-height: 1;
      font-weight: 900;
    }

    .stat span {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      font-size: 26px;
      line-height: 1.12;
      font-weight: 690;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: 28px;
      color: rgba(248,251,255,0.62);
      font-size: 23px;
      line-height: 1.2;
      font-weight: 650;
    }

    .site {
      color: var(--ink);
      font-weight: 840;
    }
  </style>
</head>
<body>
  <main class="post" aria-label="Oggi su Somto sono stati caricati 1.400.256 minuti di visione">
    <section class="content">
      <header class="brand">
        <img class="logo" src="../../public/icons/somto.w.png" alt="Somto">
        <div class="date">9 luglio 2026</div>
      </header>

      <div class="eyebrow">Dato dal backstage</div>
      <h1>
        <span class="number">1.400.256</span>
        <span class="label">minuti caricati oggi su Somto</span>
      </h1>
      <p class="lead">Film e serie stanno entrando nelle librerie degli utenti, un titolo alla volta.</p>

      <div class="stats" aria-label="Conversione dei minuti caricati">
        <div class="stat">
          <strong>23.338</strong>
          <span>ore di visione</span>
        </div>
        <div class="stat">
          <strong>972</strong>
          <span>giorni di film e serie</span>
        </div>
      </div>

      <footer class="footer">
        <span>Dati caricati e aggiornati nelle librerie Somto.</span>
        <span class="site">somto.it</span>
      </footer>
    </section>
  </main>
</body>
</html>
